[package]
name = "atelier-forge"
description = "The forge behind a project: its pull requests, reviews and checks, in atelier's words, and the GitHub backend."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
gpui-kit.workspace = true
beui.workspace = true
atelier-project.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Transports that replay and record answers, for tests and benchmarks.
testing = []

[dev-dependencies]
atelier-forge = { path = ".", features = ["testing"] }
tempfile = "3"
