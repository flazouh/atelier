[package]
name = "lathe-forge"
description = "The forge behind a project: its pull requests, reviews and checks, in lathe's words, and the GitHub backend."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gpui-kit.workspace = true
beui.workspace = true
lathe-project.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Transports that replay and record answers, for tests and benchmarks.
testing = []

[dev-dependencies]
lathe-forge = { path = ".", features = ["testing"] }
tempfile = "3"
