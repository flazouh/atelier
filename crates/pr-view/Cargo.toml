[package]
name = "atelier-pr-view"
description = "The pull request view on real data: the list of pull requests, and one pull request with its checks, conversation, files and diff, over the forge and the project's git."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
gpui-kit.workspace = true
atelier-ui.workspace = true
atelier-editor.workspace = true
atelier-forge.workspace = true
atelier-lsp.workspace = true
atelier-project.workspace = true
atelier-review.workspace = true
futures-channel = "0.3"
futures-util = "0.3"
lsp-types = "0.97"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"
