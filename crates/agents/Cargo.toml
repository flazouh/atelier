[package]
name = "atelier-agents"
description = "Agents in atelier: their session model and backends, and each one's look for atelier-ui: Claude's spark, colours, and wording."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
gpui-kit.workspace = true
atelier-ui.workspace = true
atelier-i18n.workspace = true
atelier-project.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"

[dev-dependencies]
tempfile = "3"
