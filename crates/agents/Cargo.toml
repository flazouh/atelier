[package]
name = "lathe-agents"
description = "Agents in lathe: their session model and backends, and each one's look for beui: Claude's spark, colours, and wording."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
gpui-kit.workspace = true
beui.workspace = true
lathe-project.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"

[dev-dependencies]
tempfile = "3"
