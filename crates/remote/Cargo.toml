[package]
name = "lathe-remote"
description = "The Project interface over a pipe: lathe-remote serves it on a host, RemoteProject speaks to it."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "lathe-remote"
path = "src/bin/lathe-remote.rs"

[dependencies]
lathe-project.workspace = true
lathe-tracker.workspace = true
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
