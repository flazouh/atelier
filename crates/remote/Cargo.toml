[package]
name = "atelier-remote"
description = "The Project interface over a pipe: atelier-remote serves it on a host, RemoteProject speaks to it."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "atelier-remote"
path = "src/bin/atelier-remote.rs"

[dependencies]
atelier-project.workspace = true
atelier-tracker.workspace = true
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
