[package]
name = "lathe-tracker"
description = "The tasks behind a project: a neutral Tracker interface, the local SQLite tracker, and the rules that move a task along."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
