[package]
name = "atelier-voice"
description = "Dictation: the microphone, the speech model that runs on this machine, and the sound cues."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
dirs = "6"
parakeet-rs = "0.3"
sha2 = "0.10"
ureq = "3"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSSound"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }

[dev-dependencies]
hound = "3"
tempfile = "3"
