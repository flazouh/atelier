[package]
name = "atelier-voice"
description = "Dictation: the sound cues that mark its start and its stop."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSSound"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }
