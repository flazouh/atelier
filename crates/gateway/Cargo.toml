[package]
name = "atelier-gateway"
description = "One MCP server that gives the agents inside atelier the capabilities of the app, starting with tasks."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
atelier-capabilities.workspace = true
serde = "1"
serde_json = "1"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"
# Plain HTTP only: the tests talk to 127.0.0.1.
ureq = { version = "3", default-features = false }
