[package]
name = "atelier-gallery"
description = "A window that shows every atelier-ui component in each state."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
gpui-kit.workspace = true
atelier-ui.workspace = true
atelier-agents.workspace = true
atelier-editor.workspace = true
atelier-lsp.workspace = true
atelier-pr-view.workspace = true
atelier-project.workspace = true
atelier-settings.workspace = true
ignore = "0.4.33"
lsp-types = "0.97"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSSound"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
