[package]
name = "beui-gallery"
description = "A window that shows every beui component in each state."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gpui-kit.workspace = true
beui = { workspace = true, features = ["cursor-themes"] }
lathe-agents.workspace = true
lathe-lsp.workspace = true
dirs = "6"
ignore = "0.4.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lsp-types = "0.97"
anyhow = "1"
futures-channel = "0.3"
futures-util = "0.3"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
