version.workspace = true
edition.workspace = true
publish.workspace = true

[dev-dependencies]
lsp-types = "0.97"

[dependencies]
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
