[package]
name = "atelier-app"
description = "atelier: the app."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "atelier"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
atelier-ui.workspace = true
atelier-agents.workspace = true
atelier-bots.workspace = true
atelier-bot-face.workspace = true
atelier-capabilities.workspace = true
atelier-editor.workspace = true
atelier-forge.workspace = true
atelier-gateway.workspace = true
atelier-github-issues.workspace = true
atelier-gmail.workspace = true
atelier-i18n.workspace = true
atelier-discord.workspace = true
atelier-linear.workspace = true
atelier-lsp.workspace = true
atelier-palette.workspace = true
atelier-pr-view.workspace = true
atelier-project.workspace = true
atelier-remote.workspace = true
atelier-review.workspace = true
atelier-slack.workspace = true
atelier-settings.workspace = true
atelier-tracker.workspace = true
atelier-voice.workspace = true
futures-channel = "0.3"
futures-util = "0.3"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
sysinfo = { version = "0.31", default-features = false, features = ["system"] }

[build-dependencies]
cc = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"
regex = "1"
ttf-parser = "0.25"
