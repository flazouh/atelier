[package]
name = "lathe-app"
description = "lathe: the app."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "lathe"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
beui.workspace = true
lathe-agents.workspace = true
lathe-editor.workspace = true
lathe-forge.workspace = true
lathe-lsp.workspace = true
lathe-pr-view.workspace = true
lathe-project.workspace = true
lathe-remote.workspace = true
lathe-review.workspace = true
lathe-settings.workspace = true
lathe-tracker.workspace = true
futures-channel = "0.3"
futures-util = "0.3"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"
regex = "1"
