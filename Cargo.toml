[workspace]
resolver = "3"
members = ["crates/*"]
# Patched copies of dependencies, not ours to test: see each one's PATCHES.md.
exclude = ["vendor/gpui-base", "vendor/gpui-component"]

[workspace.package]
version = "0.1.6"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
gpui-kit = "0.6.6"
atelier-ui = { git = "https://github.com/flazouh/atelier-ui" }
atelier-agents = { path = "crates/agents" }
atelier-capabilities = { path = "crates/capabilities" }
atelier-discord = { path = "crates/discord" }
atelier-linear = { path = "crates/linear" }
atelier-editor = { path = "crates/editor" }
atelier-forge = { path = "crates/forge" }
atelier-gateway = { path = "crates/gateway" }
atelier-github-issues = { path = "crates/github-issues" }
atelier-i18n = { path = "crates/i18n" }
atelier-lsp = { path = "crates/lsp" }
atelier-palette = { path = "crates/palette" }
atelier-pr-view = { path = "crates/pr-view" }
atelier-project = { path = "crates/project" }
atelier-remote = { path = "crates/remote" }
atelier-review = { path = "crates/review" }
atelier-settings = { path = "crates/settings" }
atelier-slack = { path = "crates/slack" }
atelier-tracker = { path = "crates/tracker" }
atelier-voice = { path = "crates/voice" }

[patch.crates-io]
# gpui-base 0.6.6 with the editor fixes in vendor/gpui-base/PATCHES.md.
gpui-base = { path = "vendor/gpui-base" }
# gpui-component 0.6.6 with the highlighter fix in vendor/gpui-component/PATCHES.md.
gpui-component = { path = "vendor/gpui-component" }
